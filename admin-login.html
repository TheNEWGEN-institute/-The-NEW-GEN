<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบจัดการ (Admin Login) | The NEW GEN</title>
  
  <link rel="icon" type="image/png" href="assets/images/tutor-au.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css?v=20261021-fix2">
</head>
<body class="page-admin-login">

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      
      <!-- Logo Header -->
      <div class="admin-login-header">
        <div class="brand-logo-badge" style="margin: 0 auto 12px; width: 54px; height: 54px;">
          <i class="fa-solid fa-bolt-lightning" style="color: var(--color-red-brand); font-size: 1.5rem;"></i>
        </div>
        <h1 class="admin-brand-title">The <span>NEW</span> <span style="color: var(--color-red-brand);">GEN</span></h1>
        <p class="admin-login-subtitle">ระบบจัดการเว็บไซต์หลังบ้าน (Admin Control Panel)</p>
      </div>

      <!-- Login Form -->
      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group-luxury">
          <label><i class="fa-solid fa-envelope"></i> อีเมลผู้ดูแลระบบ (Email)</label>
          <input type="email" id="adminUser" placeholder="you@example.com" required autocomplete="username">
        </div>

        <div class="form-group-luxury">
          <label><i class="fa-solid fa-key"></i> รหัสผ่าน (Password)</label>
          <div class="password-input-wrap">
            <input type="password" id="adminPass" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-eye" onclick="togglePassVisibility()" aria-label="แสดงรหัสผ่าน">
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div id="loginErrorMsg" class="login-error-alert" style="display: none;">
          <i class="fa-solid fa-triangle-exclamation"></i> <span id="loginErrorText">อีเมลหรือรหัสผ่านไม่ถูกต้อง</span>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 1rem; margin-top: 10px;">
          <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบหลังบ้าน
        </button>
      </form>

      <div class="admin-login-footer">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> กลับสู่หน้าแรกเว็บไซต์</a>
      </div>

    </div>
  </div>

  <script src="assets/js/courses-data.js?v=20261021-fix2"></script>
  <script>
    // ถ้ายังมี session แอดมินที่ใช้ได้อยู่ ให้ไปหน้า admin ทันที
    (async () => {
      if (window.NewGenAuth && window.NewGenAuth.getSession()) {
        const token = await window.NewGenAuth.getAccessToken();
        if (token && window.NewGenAuth.isAdminSession()) window.location.href = 'admin.html';
      }
    })();

    function togglePassVisibility() {
      const pass = document.getElementById('adminPass');
      const eye = document.getElementById('eyeIcon');
      if (pass.type === 'password') {
        pass.type = 'text';
        eye.className = 'fa-solid fa-eye-slash';
      } else {
        pass.type = 'password';
        eye.className = 'fa-solid fa-eye';
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value;
      const errBox = document.getElementById('loginErrorMsg');
      const errText = document.getElementById('loginErrorText');
      const submitBtn = document.getElementById('btnLoginSubmit');

      const showError = (msg) => {
        if (errText) errText.textContent = msg;
        if (errBox) errBox.style.display = 'flex';
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบหลังบ้าน';
        }
      };

      if (errBox) errBox.style.display = 'none';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบ...';
      }

      // ตรวจรหัสผ่านที่ Supabase Auth (รหัสผ่านไม่ถูกเก็บหรือเทียบในหน้าเว็บ)
      try {
        const session = await window.NewGenAuth.signIn(email, pass);
        if (!window.NewGenAuth.isAdminSession(session)) {
          await window.NewGenAuth.signOut();
          showError('บัญชีนี้ยังไม่ได้รับสิทธิ์ผู้ดูแลระบบ');
          return;
        }
        window.location.href = 'admin.html';
      } catch (err) {
        console.warn('Admin login failed:', err);
        showError(err.status === 400 ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : 'เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
      }
    }
  </script>
</body>
</html>
