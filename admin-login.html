<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบจัดการ (Admin Login) | The NEW GEN</title>
  
  <link rel="icon" type="image/png" href="assets/images/tutor-au.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-admin-login">

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      
      <!-- Logo Header -->
      <div class="admin-login-header">
        <div class="brand-logo-badge" style="margin: 0 auto 12px; width: 54px; height: 54px;">
          <i class="fa-solid fa-bolt-lightning" style="color: var(--color-red-brand); font-size: 1.5rem;"></i>
        </div>
        <h1 class="admin-brand-title">The <span>NEW</span> <span style="color: var(--color-red-brand);">GEN</span></h1>
        <p class="admin-login-subtitle">ระบบจัดการเว็บไซต์หลังบ้าน (Admin Control Panel)</p>
      </div>

      <!-- Login Form -->
      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group-luxury">
          <label><i class="fa-solid fa-user"></i> ชื่อผู้ใช้งาน (Username)</label>
          <input type="text" id="adminUser" placeholder="admin" required autocomplete="username">
        </div>

        <div class="form-group-luxury">
          <label><i class="fa-solid fa-key"></i> รหัสผ่าน (Password)</label>
          <div class="password-input-wrap">
            <input type="password" id="adminPass" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-eye" onclick="togglePassVisibility()" aria-label="แสดงรหัสผ่าน">
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div id="loginErrorMsg" class="login-error-alert" style="display: none;">
          <i class="fa-solid fa-triangle-exclamation"></i> ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 1rem; margin-top: 10px;">
          <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบหลังบ้าน
        </button>
      </form>

      <div class="admin-login-footer">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> กลับสู่หน้าแรกเว็บไซต์</a>
      </div>

    </div>
  </div>

  <script src="assets/js/courses-data.js"></script>
  <script>
    // ถ้าเคยเข้าสู่ระบบแล้ว ให้จำไว้และไปหน้า admin ทันที
    if (localStorage.getItem('newgen_admin_auth') === 'true' || sessionStorage.getItem('newgen_admin_auth') === 'true') {
      window.location.href = 'admin.html';
    }

    function togglePassVisibility() {
      const pass = document.getElementById('adminPass');
      const eye = document.getElementById('eyeIcon');
      if (pass.type === 'password') {
        pass.type = 'text';
        eye.className = 'fa-solid fa-eye-slash';
      } else {
        pass.type = 'password';
        eye.className = 'fa-solid fa-eye';
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value.trim();
      const errBox = document.getElementById('loginErrorMsg');
      const submitBtn = document.getElementById('btnLoginSubmit');

      if (errBox) errBox.style.display = 'none';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบ...';
      }

      // ดึงข้อมูลรหัสผ่านที่ตั้งไว้ (จาก LocalStorage / ค่าเริ่มต้น)
      let cred = window.NewGenDB ? window.NewGenDB.getAdminAuth() : { username: 'admin', password: 'NewGen@2026' };

      // พยายามดึงรหัสผ่านล่าสุดจาก Supabase เพื่อให้แม่นยำ 100% แม้เปลี่ยนจากเครื่องอื่น
      try {
        if (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url) {
          const res = await fetch(`${window.SUPABASE_CONFIG.url}/rest/v1/app_data?key=eq.admin&select=data`, {
            headers: {
              'apikey': window.SUPABASE_CONFIG.anonKey,
              'Authorization': `Bearer ${window.SUPABASE_CONFIG.anonKey}`
            }
          });
          if (res.ok) {
            const rows = await res.json();
            if (rows && rows.length > 0 && rows[0].data) {
              cred = rows[0].data;
              localStorage.setItem('newgen_admin_cred', JSON.stringify(cred));
            }
          }
        }
      } catch (err) {
        console.warn('Network auth fallback to local credentials:', err);
      }

      // ตรวจสอบชื่อผู้ใช้งานและรหัสผ่าน
      const validUser = (user === cred.username || (cred.username === 'admin' && user === 'thenewgen'));
      const validPass = (pass === cred.password);

      if (validUser && validPass) {
        localStorage.setItem('newgen_admin_auth', 'true');
        localStorage.setItem('newgen_admin_user', user);
        sessionStorage.setItem('newgen_admin_auth', 'true');
        sessionStorage.setItem('newgen_admin_user', user);
        window.location.href = 'admin.html';
      } else {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบหลังบ้าน';
        }
        if (errBox) errBox.style.display = 'flex';
      }
    }
  </script>
</body>
</html>
