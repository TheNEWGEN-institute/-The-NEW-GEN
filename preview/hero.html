    .pv-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 500; display: flex; gap: 8px; max-width: calc(100vw - 16px); }
    .pv-grp { background: #0b1e3f; color: #fff; border-radius: 999px; padding: 5px; display: flex; gap: 3px; align-items: center; box-shadow: 0 12px 30px rgba(11,30,63,.4); border: 1px solid rgba(255,255,255,.15); }
    .pv-grp b { font-size: .76rem; padding: 0 8px; opacity: .8; font-weight: 500; white-space: nowrap; }
    .pv-grp button { border: 0; background: transparent; color: #fff; font: inherit; font-size: .85rem; font-weight: 700; padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .pv-grp button.on { background: #fff; color: #0b1e3f; }
    .pv-name { position: fixed; left: 16px; top: 96px; z-index: 40; background: #fef9c3; color: #713f12; font-size: .8rem; padding: 6px 12px; border-radius: 10px; box-shadow: 0 6px 16px rgba(0,0,0,.15); max-width: calc(100vw - 32px); }
    .pv-rest { max-width: 1280px; margin: 0 auto; padding: 40px 40px 160px; color: #64748b; font-size: .9rem; }
    .pv-rest .pv-box { background: #fff; border-radius: 18px; padding: 26px; border: 1px dashed #cbd5e1; }
    @media (max-width: 760px) { .pv-bar { gap: 4px; bottom: 8px; } .pv-grp { padding: 3px; } .pv-grp b { display: none; } .pv-grp button { padding: 6px 10px; font-size: .76rem; } .pv-name { display: none; } .pv-rest { padding: 24px 16px 110px; } }
  </style>
</head>
<body class="ng-theme pv-hero">
  <svg aria-hidden="true" width="0" height="0" style="position:absolute"><defs><linearGradient id="ngLogoGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a78ff"/><stop offset="0.5" stop-color="#2152e6"/><stop offset="1" stop-color="#1235b8"/></linearGradient></defs></svg>

  <header class="site-header navbar-white scrolled" id="topHeader">

      <a href="../index.html" class="brand-logo" aria-label="หน้าแรก The NEW GEN">
        <div>
          <div class="brand-logo-text logo-v2">
            <span>The</span> <span class="new"><svg class="logo-glyph logo-glyph-n" viewBox="0 0 74 75" aria-hidden="true"><path d="M7 0h15v44H7zM52 0h16v75H52zM7 0h19l42 75H49z"/></svg><svg class="logo-glyph logo-glyph-e" viewBox="0 0 59 75" aria-hidden="true"><path d="M7 0h50v14H7zM7 24h15v51H7zM22 31h31v13H22zM22 61h35v14H22z"/></svg>W</span> <span class="gen">G<svg class="logo-glyph logo-glyph-e" viewBox="0 0 59 75" aria-hidden="true"><path d="M7 0h50v14H7zM7 24h15v51H7zM22 31h31v13H22zM22 61h35v14H22z"/></svg><svg class="logo-glyph logo-glyph-n" viewBox="0 0 74 75" aria-hidden="true"><path d="M7 0h15v44H7zM52 0h16v75H52zM7 0h19l42 75H49z"/></svg></span>
          </div>
          <span class="brand-subtext">กวดวิชาของเด็ก <span class="highlight-gen">GEN</span> ใหม่</span>

      <nav class="nav-links">
        <a href="#" class="nav-link active">หน้าแรก</a>
        <a href="#" class="nav-link">ทีมติวเตอร์</a>

  <div class="pv-name" id="pvName"></div>

  <section class="hs" id="hs" aria-roledescription="carousel" aria-label="ไฮไลต์ The NEW GEN"></section>

  <div class="pv-rest"><div class="pv-box">(ส่วนอื่นของหน้าแรกต่อจากสไลด์ — คอร์สแนะนำ, รีวิว ฯลฯ เหมือนเดิม)</div></div>

  <div class="pv-bar">
    <div class="pv-grp" role="group" aria-label="เลือกแบบ"><b>แบบ</b><button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button></div>
    <div class="pv-grp" role="group" aria-label="รูปที่"><b>รูปที่</b><button type="button" data-s="0">1</button><button type="button" data-s="1">2</button><button type="button" data-s="2">3</button></div>
  </div>

  <script>
  (function () {
    const IMG = '../assets/images/';
    const CUT = IMG + 'tutors-cutout/';
    const REVIEWS = [
      'https://wdazilhmlttnurpfewlk.supabase.co/storage/v1/object/public/uploads/img-1792003643929-i955.jpg',
      'https://wdazilhmlttnurpfewlk.supabase.co/storage/v1/object/public/uploads/img-1792003652213-7qqw.jpg',
      'https://wdazilhmlttnurpfewlk.supabase.co/storage/v1/object/public/uploads/img-1792003657406-v97s.jpg'
    ];
    const NAMES = {
      1: 'แบบ 1 · Soft Blend — 2 รูปเต็มฝั่งขวา เฟดกลืนกันและกลืนเข้าพื้นน้ำเงิน',
      2: 'แบบ 2 · Glow Panels — 2 แผงรูปขอบมน มีแสงขอบ + ประกายดาว',
      3: 'แบบ 3 · Cinematic Light — เฟดแนวเฉียง แสงวิ่งผ่านรูป ตัว GEN มีประกาย'
    };

    // ท่า B: พี่นนท์ปกติ (หันขวา) + พี่อู๋กลับด้าน (หันซ้าย) อยู่ด้านหน้า — ป้ายชื่อสีขาวทุกคน
    const TEAM = [['mac', 'พี่แม็ค', 'tutor-mac.webp', 0], ['non', 'พี่นนท์', 'tutor-non.webp', 2], ['au', 'พี่อู๋', 'tutor-au-flip.webp', 3], ['anont', 'พี่อานนท์', 'tutor-anont.webp', 1]];
    const team = () => `<div class="team">${TEAM.map(t => `
      <figure class="tt tt-${t[0]}" style="--i:${t[3]}"><img src="${CUT + t[2]}" alt="${t[1]}"><figcaption>${t[1]}</figcaption></figure>`).join('')}</div>`;

    const DECO = {
      1: `<div class="orb" style="width:340px;height:340px;left:38%;top:8%;background:#2a54d6"></div><div class="orb" style="width:260px;height:260px;left:-4%;bottom:6%;background:#f43f5e;opacity:.18"></div>`,
      2: `<div class="ring" style="width:620px;height:620px;right:-120px;top:60px"></div><div class="ring" style="width:420px;height:420px;right:-20px;top:160px;border-style:dashed"></div>
          <i class="fa-solid fa-star spark" style="right:9%;top:16%;font-size:1rem"></i><i class="fa-solid fa-star spark" style="right:47%;top:46%;font-size:.7rem;animation-delay:.8s"></i><i class="fa-solid fa-star spark" style="right:4%;bottom:14%;font-size:.85rem;animation-delay:1.5s"></i>`,
      3: `<div class="water">NEW GEN</div>`
    };

    function slide1(v) {
      return `<div class="grid"></div>${DECO[v]}
        <div class="s1-photos">
          <figure class="ph ph-1 kb" data-pop style="--d:0"><img src="${IMG}hero/kids-1.jpg" alt="น้อง ๆ The NEW GEN"></figure>
          <figure class="ph ph-2 kb" data-pop style="--d:1"><img src="${IMG}hero/kids-2.jpg" alt="บรรยากาศห้องเรียน The NEW GEN"></figure>
          ${v === 3 ? '<div class="seam"></div>' : ''}
        </div>
        <div class="hs-wrap"><div class="s1-left">
          <div class="hs-inst" data-in style="--d:0">สถาบันกวดวิชา</div>
          <h1 class="hs-brand" data-in style="--d:1"><span class="new">The NEW</span> <span class="gen${v === 3 ? ' shine' : ''}">GEN</span></h1>
          <p class="hs-slogan" data-in style="--d:2">กวดวิชาของเด็ก <b>GEN ใหม่</b></p>
          ${team()}
        </div></div>`;
    }

    const slide2 = () => `<div class="bgimg kb"></div><div class="tone"></div><div class="shade"></div><div class="line"></div>
      <div class="hs-wrap">
        <span class="hs-kicker" data-in style="--d:0"><i></i> เปิดรับสมัครแล้ว</span>
        <h2 data-in style="--d:1">คอร์สรายเทอม <em>2/69</em></h2>
        <p data-in style="--d:2">ห้องเรียนกลุ่มเล็ก ดูแลทั่วถึง เรียนได้ทั้ง Onsite และ Online · ที่นั่งมีจำกัดในแต่ละรอบ</p>
        <div class="lv" data-in style="--d:3"><div><b>ป.4 – ป.6</b><span>เรียนล่วงหน้า · ติวสอบเข้า ม.1</span></div><div><b>ม.1 – ม.3</b><span>เสริมเกรด · ติวสอบเข้า ม.4</span></div><div><b>ม.4 – ม.6</b><span>คณิต · ฟิสิกส์ · เคมี · อังกฤษ</span></div></div>
        <a href="#" class="hs-more" data-in style="--d:4">ดูคอร์สและตารางเรียน <i class="fa-solid fa-arrow-right"></i></a>
      </div>`;

    const slide3 = () => `<div class="fan">${REVIEWS.map((u, i) => `<div class="rv" data-pop style="--d:${i}"><img src="${u}" alt="ความสำเร็จของรุ่นพี่ The NEW GEN" loading="lazy"></div>`).join('')}</div>
      <div class="hs-wrap"><div class="txt">
        <span class="hs-kicker" data-in style="--d:0"><i></i> ความสำเร็จของรุ่นพี่</span>
        <h2 data-in style="--d:1">รุ่นพี่ <span style="white-space:nowrap">The NEW GEN</span><br><em>สอบติดคณะในฝัน</em></h2>
        <p data-in style="--d:2">วิศวะ คอม จุฬาฯ · นิติศาสตร์ มธ. · บริหารธุรกิจ มศว และอีกมากมาย</p>
        <a href="#" class="hs-more" data-in style="--d:3">ดูความสำเร็จทั้งหมด <i class="fa-solid fa-arrow-right"></i></a>
      </div></div>`;

    const root = document.getElementById('hs');
    const MS = 6500;
    let v = Number(new URLSearchParams(location.search).get('v')) || 1; if (!NAMES[v]) v = 1;
    let idx = 0, timer = null;

    function build(startAt) {
      root.className = 'hs v' + v;
      root.style.setProperty('--hs-ms', MS + 'ms');
      root.innerHTML = `
        <article class="hs-slide s1" aria-roledescription="slide" aria-label="1 / 3">${slide1(v)}</article>
        <article class="hs-slide s2" aria-roledescription="slide" aria-label="2 / 3">${slide2()}</article>
        <article class="hs-slide s3" aria-roledescription="slide" aria-label="3 / 3">${slide3()}</article>
        <div class="hs-nav">
          <div class="hs-dots">${[0, 1, 2].map(i => `<button type="button" aria-label="ไปสไลด์ ${i + 1}"><i></i></button>`).join('')}</div>
          <button type="button" class="hs-arrow hs-prev" aria-label="สไลด์ก่อนหน้า"><i class="fa-solid fa-chevron-left"></i></button>
          <button type="button" class="hs-arrow hs-next" aria-label="สไลด์ถัดไป"><i class="fa-solid fa-chevron-right"></i></button>
        </div>`;
      root.querySelector('.hs-prev').onclick = () => go(idx - 1);
      root.querySelector('.hs-next').onclick = () => go(idx + 1);
      root.querySelectorAll('.hs-dots button').forEach((b, i) => { b.onclick = () => go(i); });
      document.getElementById('pvName').textContent = NAMES[v] + ' (ตัวอย่าง)';
      document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', Number(b.dataset.v) === v));
      history.replaceState(null, '', '?v=' + v);
      go(startAt || 0);
    }

    function go(n) {
      const slides = root.querySelectorAll('.hs-slide');
      idx = (n + slides.length) % slides.length;
      slides.forEach((s, i) => s.classList.toggle('is-active', i === idx));
      root.querySelectorAll('.hs-dots button').forEach((b, i) => {
        b.classList.remove('on'); b.classList.toggle('done', i < idx);
        const bar = b.querySelector('i'); bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
        if (i === idx) b.classList.add('on');
      });
      document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', Number(b.dataset.s) === idx));
      clearTimeout(timer);
      if (!root.classList.contains('is-paused')) timer = setTimeout(() => go(idx + 1), MS);
    }

    root.addEventListener('mouseenter', () => { root.classList.add('is-paused'); clearTimeout(timer); });
    root.addEventListener('mouseleave', () => { root.classList.remove('is-paused'); go(idx); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(timer); else go(idx); });
    let x0 = null;
    root.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    root.addEventListener('touchend', e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
    });

    document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => { v = Number(b.dataset.v); build(idx); }));
    document.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => go(Number(b.dataset.s))));
    window.hsGo = go;
    build(0);
  })();
  </script>
</body>
